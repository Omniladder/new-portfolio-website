---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create web root
  ansible.builtin.file:
    path: "{{ portfolio_web_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install portfolio site config
  ansible.builtin.template:
    src: portfolio.conf.j2
    dest: /etc/nginx/sites-available/portfolio.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Test nginx config
    - Reload nginx

- name: Enable portfolio site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/portfolio.conf
    dest: /etc/nginx/sites-enabled/portfolio.conf
    state: link
  notify:
    - Test nginx config
    - Reload nginx

- name: Disable default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify:
    - Test nginx config
    - Reload nginx

- name: Start nginx on boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
