---
# Installs nginx, syncs this repo (with data.json and assets/) to the host,
# builds the site there with generate.py, and publishes dist/ to the web root.
# See docs/guides/deploying.md and docs/arch/0044.
- name: Deploy portfolio site
  hosts: portfolio
  become: true
  roles:
    - nginx
    - portfolio
  # Runs on every deploy, after the site is published. Handlers only fire on
  # a changed task, so a deploy that left the nginx config alone would
  # otherwise keep serving whatever config was live before.
  post_tasks:
    - name: Test nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
